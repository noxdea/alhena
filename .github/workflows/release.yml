name: Release
on:
  push:
    tags:
      - 'v*'
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Publish gem
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read # checkout
      id-token: write # exchange GitHub OIDC for a short-lived RubyGems token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.4'
      - name: Verify tag and version
        run: test "${GITHUB_REF_NAME}" = "v$(ruby -Ilib -ralhena/version -e 'print Alhena::VERSION')"
      - name: Test and build
        run: |
          bundle install
          bundle exec rake
          bundle exec rbs -I sig validate
          gem build --strict alhena.gemspec --output alhena.gem
      - name: Publish through RubyGems trusted publishing
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
